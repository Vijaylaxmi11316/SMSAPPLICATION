<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | RGUKT RK Valley</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #0f1a2b, #1b2d47);
            font-family: "Poppins", sans-serif;
            color: white;
            min-height: 100vh;
            margin: 0;
            position: relative;
        }

        /* Header Section */
        .header {
            display: flex;
            align-items: center;
            padding: 20px;
            gap: 15px;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(10px);
        }

        .header img {
            width: 70px;
            border-radius: 4px;
        }

        .header-title {
            font-size: 22px;
            font-weight: 600;
        }

        /* Cards */
        .dashboard-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(8px);
            border-radius: 18px;
            padding: 30px 20px;
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .dashboard-card:hover {
            transform: translateY(-7px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .dashboard-card img {
            width: 140px;
            margin-bottom: 15px;
        }

        /* Logout bottom-right */
        .logout-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10;
        }
    </style>

</head>

<body>

<!-- HEADER -->
<div class="header">
    <img th:src="@{/images/rgukt_logo.jpeg}">
    <div class="header-title">
        Rajiv Gandhi University of Knowledge Technologies, RK Valley — Admin Portal
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="container text-center mt-5">

    <h2 class="mb-4" style="font-weight:600;">Welcome, Admin</h2>

    <div class="row justify-content-center mt-4">

        <!-- Manage Students -->
        <div class="col-md-4 mb-4">
            <div class="dashboard-card" th:onclick="'window.location.href=\'/admin/students\''">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png" alt="Students Icon">
                <h4 class="mt-2">Manage Students</h4>
                <p>View, Update, and Monitor student data</p>
            </div>
        </div>

        <!-- Manage Staffs -->
        <div class="col-md-4 mb-4">
            <div class="dashboard-card" th:onclick="'window.location.href=\'/admin/staffs\''">
                <img src="https://cdn-icons-png.flaticon.com/512/2922/2922510.png" alt="Staff Icon">
                <h4 class="mt-2">Manage Staffs</h4>
                <p>Handle staff records, roles and updates</p>
            </div>
        </div>

    </div>

</div>

<!-- LOGOUT BUTTON (BOTTOM-RIGHT) -->
<a th:href="@{/logout}" class="btn btn-danger logout-btn">Logout</a>

</body>
</html>
