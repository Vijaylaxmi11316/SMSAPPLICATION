<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="#">Student Dashboard</a>
    <a class="btn btn-outline-light" th:href="@{/}">Home</a>
</nav>

<div class="container py-5">
    
    <!-- Display student name -->
    <h2 class="text-center mb-4">
        Welcome, 
        <span th:text="${student != null ? student.firstName : 'Student'}">Student</span>
    </h2>

    <div class="row justify-content-center">

        <!-- Profile -->
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm text-center p-3">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                     class="card-img-top p-4 mx-auto" alt="Profile" 
                     style="height:140px; width:auto; object-fit:contain;">

                <div class="card-body">
                    <h5 class="card-title">View Profile</h5>
                    <p class="card-text">Check your personal and academic details.</p>

					<a th:href="@{/student/profile}" class="btn btn-primary">Open Profile</a>

                </div>
            </div>
        </div>

        <!-- Requests -->
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm text-center p-3">

                <img src="https://cdn-icons-png.flaticon.com/512/4378/4378798.png"
                     class="card-img-top p-4 mx-auto" alt="Request" 
                     style="height:140px; width:auto; object-fit:contain;">

                <div class="card-body">
                    <h5 class="card-title">Request Certificate</h5>
                    <p class="card-text">Submit request for OD / PC / CMM / Bonafide.</p>

                    <!-- FIXED Request Button -->
                    <a th:href="@{/student/requests}" 
                       class="btn btn-success">
                       My Requests
                    </a>
                </div>
            </div>
        </div>

    </div>

    <div class="text-center mt-3">
        <a th:href="@{/logout}" class="btn btn-secondary">Logout</a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
