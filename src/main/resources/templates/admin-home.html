<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGUKT Admin Portal</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        /* Animated Background */
        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            color: #fff;
            background: linear-gradient(135deg, #06173d, #0b335a, #1e3c72, #2a5298);
            background-size: 400% 400%;
            animation: gradientShift 13s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Page Title */
        header img {
            width: 90px;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.6));
        }

        header h1 {
            margin-top: 12px;
            font-weight: 700;
            font-size: 1.8rem;
        }

        /* Glass Cards */
        .card-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            padding: 25px;
            color: #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.25);
            transition: 0.4s ease;
            cursor: pointer;
        }

        .card-box:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 0 35px rgba(0,0,0,0.45);
        }

        .card-icon {
            font-size: 45px;
            margin-bottom: 12px;
            color: #ffda6b;
            text-shadow: 0 0 12px rgba(255, 221, 87, 0.5);
        }

        .btn-custom {
            padding: 12px 25px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            background: #ffffff;
            color: #003366;
            transition: 0.3s;
        }

        .btn-custom:hover {
            background: #ffcc00;
            color: #003366;
            box-shadow: 0px 4px 15px rgba(255, 204, 0, 0.6);
            transform: scale(1.05);
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: #c7e6ff;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

<header class="text-center mt-4">
    <img th:src="@{/images/rgukt_logo.jpeg}" alt="RGUKT Logo">
    <h1>Rajiv Gandhi University of Knowledge Technologies – RK Valley</h1>
    <h5 class="mt-2 text-light">Admin Home</h5>
</header>

<!-- Cards Section -->
<div class="container mt-5">

    <div class="row g-4 justify-content-center">

        <!-- Dashboard -->
        <div class="col-md-4">
            <a th:href="@{/admin/dashboard}" style="text-decoration: none;">
                <div class="card-box text-center">
                    <div class="card-icon">📊</div>
                    <h4>Dashboard</h4>
                    <p>View statistics, student count, staff count and updates.</p>
                </div>
            </a>
        </div>

        

    </div>

    <div class="text-center mt-5">
        <button onclick="window.location.href='/logout'" class="btn-custom">Logout</button>
    </div>

</div>

<footer>
    © 2025 Rajiv Gandhi University of Knowledge Technologies, RK Valley | All Rights Reserved
</footer>

</body>
</html>
