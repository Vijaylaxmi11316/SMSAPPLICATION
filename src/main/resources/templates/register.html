<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <style>
        body { font-family: Arial; background: #f3f7f9; display: flex; justify-content: center; align-items: center; height: 100vh; }
        form { background: white; padding: 25px; border-radius: 12px; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        h2 { text-align: center; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #ccc; }
        button { width: 100%; padding: 10px; background: #28a745; border: none; color: white; border-radius: 6px; cursor: pointer; }
        button:hover { background: #218838; }
        .error { color: red; text-align: center; }
        .success { color: green; text-align: center; }
    </style>
</head>
<body>
<form th:action="@{/register}" method="post" th:object="${user}">
    <h2>Register</h2>

    <div th:if="${error}" class="error" th:text="${error}"></div>
    <div th:if="${success}" class="success" th:text="${success}"></div>

    <input type="text" th:field="*{firstName}" placeholder="First Name" required>
    <input type="text" th:field="*{lastName}" placeholder="Last Name" required>
    <input type="email" th:field="*{email}" placeholder="Email" required>
    <input type="password" th:field="*{password}" placeholder="Password" required>

    <select th:field="*{role}">
        <option value="STUDENT">STUDENT</option>
        <option value="STAFF">STAFF</option>
        <option value="ADMIN">ADMIN</option>
    </select>

    <button type="submit">Register</button>
    <p style="text-align:center;">Already have an account? <a th:href="@{/login}">Login</a></p>
</form>
</body>
</html>
