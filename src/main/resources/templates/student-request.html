<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>My Requests</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand">My Requests</a>
    <a class="btn btn-outline-light" th:href="@{'/student/dashboard/' + ${email}}">Back</a>
</nav>

<div class="container py-5">

    <div class="d-flex justify-content-between mb-3">
        <h3>Your Request History</h3>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#requestModal">
            Make New Request
        </button>
    </div>

    <div class="table-responsive">
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Request</th>
            <th>Your Comment</th>
            <th>Status</th>
            <th>Staff Response</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="r : ${requests}">
            <td th:text="${r.id}">1</td>
            <td th:text="${r.body}">Request details</td>
            <td th:text="${r.studentComment}">—</td>

            <td>
                <span th:classappend="${r.status=='Waiting' ? 'badge bg-secondary' :
                                       r.status=='Approved' ? 'badge bg-success' :
                                       r.status=='Rejected' ? 'badge bg-danger' :
                                       'badge bg-dark'}"
                      th:text="${r.status}">Waiting</span>
            </td>

            <td th:text="${r.staffComment != null ? r.staffComment : '—'}">—</td>

            <td>
                <!-- Delete only if waiting -->
				<a th:if="${r.status=='Waiting'}"
				   th:href="@{'/student/request/delete/' + ${r.id}}"
				   class="btn btn-danger btn-sm">Delete</a>


                <!-- Reply modal trigger -->
                <button th:if="${r.status=='Approved' or r.status=='Rejected'}"
                        class="btn btn-info btn-sm"
                        data-bs-toggle="modal"
                        th:data-bs-target="${'#replyModal-' + r.id}">
                    Reply
                </button>

                <span th:if="${r.status=='Closed'}" class="badge bg-dark">Closed</span>
            </td>
        </tr>
        </tbody>
    </table>
    </div>

    <!-- Reply Modal(s) -->
    <div th:each="r : ${requests}">
        <div class="modal fade" th:id="${'replyModal-' + r.id}" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form th:action="@{/student/reply}" method="post">
                        <input type="hidden" name="id" th:value="${r.id}"/>
                        <input type="hidden" name="email" th:value="${email}"/>

                        <div class="modal-header">
                            <h5 class="modal-title">Reply to Staff</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>

                        <div class="modal-body">
                            <label>Your Reply</label>
                            <textarea name="studentComment" class="form-control" required></textarea>
                        </div>

                        <div class="modal-footer">
                            <button type="submit" class="btn btn-success">Send</button>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- New request modal -->
    <div class="modal fade" id="requestModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content p-3">
          <form th:action="@{/student/requests/add}" method="post">
            <!-- include email and student name from model -->
            <input type="hidden" name="studentEmail" th:value="${email}" />
            <input type="hidden" name="studentName" th:value="${student != null ? student.firstName + ' ' + student.lastName : ''}" />

            <div class="mb-2">
                <label>Name:</label>
                <input class="form-control" readonly th:value="${student != null ? student.firstName + ' ' + student.lastName : 'N/A'}"/>
            </div>

            <div class="mb-2">
                <label>Email:</label>
                <input class="form-control" readonly th:value="${email}"/>
            </div>

            <div class="mb-2">
                <label>Request Details:</label>
                <textarea class="form-control" name="body" required></textarea>
            </div>

            <div class="mb-2">
                <label>Comments (Optional):</label>
				<input class="form-control" name="studentComment" id="commentInput"/>
				<small id="commentCount" class="text-muted"></small>

            </div>

            <div class="text-end">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-success">Submit</button>
            </div>
          </form>
        </div>
      </div>
    </div>

</div> <!-- container -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const commentInput = document.getElementById("commentInput");
    const commentCount = document.getElementById("commentCount");

    commentInput.addEventListener("input", () => {
        let words = commentInput.value.trim().split(/\s+/).filter(w => w.length > 0);
        let wordCount = words.length;

        if (wordCount > 300) {
            // Stop extra words
            commentInput.value = words.slice(0, 300).join(" ");
            wordCount = 300;  
        }

        commentCount.textContent = wordCount + "/300 words";
    });
</script>

</body>
</html>
