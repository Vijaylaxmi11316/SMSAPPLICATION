<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Staff</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">Add Staff</span>
    <a class="btn btn-outline-light" th:href="@{/admin/staffs}">Back</a>
</nav>

<div class="container py-4">

    <div class="card shadow-lg p-4 mx-auto" style="max-width: 650px;">
        <h3 class="text-center mb-3">Add New Staff</h3>

        <form th:action="@{/admin/staff/add}" method="post" th:object="${staff}">
            
            <div class="row">
                <div class="col-md-6 mb-2">
                    <label>First Name</label>
                    <input type="text" th:field="*{firstName}" class="form-control" required>
                </div>

                <div class="col-md-6 mb-2">
                    <label>Last Name</label>
                    <input type="text" th:field="*{lastName}" class="form-control" required>
                </div>
            </div>

            <label>Email</label>
            <input type="email" th:field="*{email}" class="form-control mb-2" required>

            <label>Phone</label>
            <input type="text" th:field="*{phone}" class="form-control mb-2">

            <div class="row">
                <div class="col-md-6 mb-2">
                    <label>Gender</label>
                    <select th:field="*{gender}" class="form-control">
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div class="col-md-6 mb-2">
                    <label>Staff ID</label>
                    <input type="text" th:field="*{staffId}" class="form-control">
                </div>
            </div>

            <label>Department</label>
            <input type="text" th:field="*{department}" class="form-control mb-2">

            <label>Designation</label>
            <input type="text" th:field="*{designation}" class="form-control mb-2">

            <label>Address</label>
            <textarea rows="2" th:field="*{address}" class="form-control mb-3"></textarea>

            <button class="btn btn-success w-100">Add Staff</button>
        </form>
    </div>
</div>

</body>
</html>
