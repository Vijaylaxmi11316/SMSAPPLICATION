<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Staffs (Admin)</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand">Manage Staffs</a>
    <a class="btn btn-outline-light" th:href="@{/admin/home}">Dashboard</a>
</nav>

<div class="container py-5">

    <h3 class="mb-4">Staff List</h3>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>Role</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>

			<tr th:each="staff : ${staffs}">
			    <td th:text="${staff.id}"></td>
			    <td th:text="${staff.firstName} + ' ' + ${staff.lastName}"></td>
			    <td th:text="${staff.email}"></td>
			    <td th:text="${staff.role}"></td>

			    <td>
			        <a th:href="@{'/admin/staff/edit/' + ${staff.id}}" 
			           class="btn btn-primary btn-sm">Edit</a>

			        <a th:href="@{'/admin/delete-staff/' + ${staff.id}}" 
			           class="btn btn-danger btn-sm"
			           onclick="return confirm('Are you sure you want to delete this staff?');">
			           Delete
			        </a>
			    </td>
			</tr>
			
			<div class="d-flex justify-content-between mb-3">
			    
			    <a class="btn btn-primary" th:href="@{/admin/staff/add}">
			        + Add Staff
			    </a>
			</div>


        </tbody>

    </table>

</div>

</body>
</html>
