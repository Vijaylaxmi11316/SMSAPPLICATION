<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Students (Admin)</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand">Manage Students</a>
    <a class="btn btn-outline-light" th:href="@{/admin/home}">Dashboard</a>
</nav>

<div class="container py-5">

    <h3 class="mb-4">Students List</h3>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="s : ${students}">
            <td th:text="${s.id}"></td>
            <td th:text="${s.firstName} + ' ' + ${s.lastName}"></td>
            <td th:text="${s.email}"></td>
            <td th:text="${s.role}"></td>
            <td>
                <a th:href="@{'/admin/edit-student/' + ${s.id}}" class="btn btn-warning btn-sm">Edit</a>
				<a th:href="@{'/admin/delete-student/' + ${s.id}}" class="btn btn-danger btn-sm">Delete</a>

            </td>
        </tr>
        </tbody>
		<div class="d-flex justify-content-between mb-3">
		    
		    <a href="/admin/add-student" class="btn btn-primary">Add Student</a>
		</div>

    </table>

</div>

</body>
</html>
