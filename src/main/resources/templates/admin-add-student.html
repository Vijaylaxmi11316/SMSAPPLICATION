<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Student • Admin</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #09203f, #537895);
            min-height: 100vh;
            padding: 40px;
        }

        .card-animated {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
            animation: slideUp 0.8s ease;
            transition: 0.3s;
        }

        .card-animated:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        label {
            font-weight: 600;
            color: #e8f2ff;
        }

        .form-control,
        .form-select {
            background: rgba(255, 255, 255, 0.15);
            border: 0;
            color: white;
        }

        .form-control:focus,
        .form-select:focus {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            box-shadow: none;
        }

        .toggle-label {
            color: #e8f2ff;
            font-weight: 500;
        }

        .btn-save {
            font-weight: 600;
            background: #10b981;
            border: none;
        }

        .btn-save:hover {
            background: #0e9f6e;
        }

        .btn-back {
            background: #fff;
            color: #06263b;
            font-weight: 600;
        }
    </style>

</head>

<body>

    <div class="container" style="max-width: 850px;">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-white fw-bold"><i class="bi bi-person-plus"></i> Add New Student</h2>
            <a th:href="@{/admin/students}" class="btn btn-back"><i class="bi bi-arrow-left"></i> Back</a>
        </div>

        <div class="card-animated">

			<form th:action="@{/admin/student/add}" method="post" th:object="${student}">


                <div class="row g-3">

                    <div class="col-md-6">
                        <label>First Name</label>
                        <input type="text" th:field="*{firstName}" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label>Last Name</label>
                        <input type="text" th:field="*{lastName}" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label>Email</label>
                        <input type="email" th:field="*{email}" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label>Roll Number</label>
                        <input type="text" th:field="*{rollNumber}" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label>Department</label>
                        <input type="text" th:field="*{department}" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label>Year/Semester</label>
                        <input type="text" th:field="*{yearSemester}" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label>Phone</label>
                        <input type="text" th:field="*{phone}" class="form-control">
                    </div>

                    <!-- GENDER TOGGLE -->
                    <div class="col-md-6">
                        <label>Gender</label>
                        <select th:field="*{gender}" class="form-select">
                            <option value="">Choose</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label>Date of Birth</label>
                        <input type="date" th:field="*{dob}" class="form-control">
                    </div>

                    <div class="col-12">
                        <label>Address</label>
                        <textarea th:field="*{address}" rows="3" class="form-control"></textarea>
                    </div>
                </div>

                <div class="text-end mt-3">
                    <button type="submit" class="btn btn-save px-4 py-2">Save Student</button>
                </div>

            </form>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
