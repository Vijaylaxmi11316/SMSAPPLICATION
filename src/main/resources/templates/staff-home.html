<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGUKT RK Valley – Staff Portal</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #00c853, #009688);
            color: white;
            overflow-x: hidden;
        }

        /* Watermark Logo */
        .bg-logo {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 450px;
            height: 450px;
            opacity: 0.06;
            transform: translate(-50%, -50%);
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 0;
            pointer-events: none;
        }

        header {
            text-align: center;
            padding-top: 40px;
            position: relative;
            z-index: 2;
        }

        header img {
            width: 85px;
            filter: drop-shadow(0px 0px 8px rgba(255,255,255,0.5));
        }

        header h1 {
            font-size: 2rem;
            margin-top: 10px;
            font-weight: 700;
        }

        .welcome-box {
            margin-top: 40px;
            z-index: 2;
            position: relative;
        }

        .dash-card {
            background: rgba(255, 255, 255, 0.15);
            padding: 35px 25px;
            border-radius: 25px;
            backdrop-filter: blur(8px);
            transition: 0.3s ease-in-out;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .dash-card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
            background: rgba(255,255,255,0.22);
        }

        .dash-card i {
            font-size: 40px;
            margin-bottom: 15px;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            padding: 15px;
            font-size: 0.9rem;
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <!-- Background Logo -->
    <div class="bg-logo" th:style="'background-image: url(' + @{/images/rgukt_logo.jpeg} + ');'"></div>

    <!-- Header -->
    <header>
        <img th:src="@{/images/rgukt_logo.jpeg}" alt="RGUKT Logo">
        <h1>Rajiv Gandhi University of Knowledge Technologies, RK Valley</h1>
    </header>

    <!-- Main Content -->
    <div class="container welcome-box text-center">
        <h2 class="fw-bold mb-3">Welcome Staff Member</h2>
        <p class="fs-5 mb-5">Access your staff dashboard and manage academic activities.</p>

        <div class="row justify-content-center">

            <!-- Staff Dashboard -->
            <div class="col-10 col-md-4 col-lg-3 mb-4">
                <div class="dash-card" onclick="window.location.href='/staff/dashboard'">
                    <i class="fa-solid fa-chalkboard-user"></i>
                    <h4>Staff Dashboard</h4>
                </div>
            </div>

            <!-- Logout -->
            <div class="col-10 col-md-4 col-lg-3 mb-4">
                <div class="dash-card" onclick="window.location.href='/logout'">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <h4>Logout</h4>
                </div>
            </div>

        </div>
    </div>

    <footer>
        © 2025 RGUKT RK Valley • All Rights Reserved
    </footer>

</body>
</html>
