<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>View Requests</title>
    <link rel="stylesheet" 
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary px-3">
    <a class="navbar-brand" href="#">View Requests</a>
    <a class="btn btn-outline-light" th:href="@{/staff/home}">Dashboard</a>
</nav>

<div class="container py-5">

    <h2 class="text-center mb-4">All Student Requests</h2>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Student Name</th>
            <th>Email</th>
            <th>Request</th>
            <th>Status</th>
            <th>Staff Comment</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${requests}">
            <td th:text="${r.id}"></td>
            <td th:text="${r.studentName}"></td>
            <td th:text="${r.studentEmail}"></td>
            <td th:text="${r.body}"></td>
            <td th:text="${r.status}"></td>
            <td th:text="${r.staffComment != null ? r.staffComment : '—'}"></td>
            <td>
                <a th:href="@{'/staff/approve/' + ${r.id}}" 
                   class="btn btn-sm btn-success">Approve</a>
                <a th:href="@{'/staff/reject/' + ${r.id}}" 
                   class="btn btn-sm btn-danger">Reject</a>

                <!-- Comment modal trigger -->
                <button class="btn btn-sm btn-info" 
                        data-bs-toggle="modal"
                        th:data-bs-target="'#commentModal-' + ${r.id}">
                    Comment
                </button>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Comment Modals -->
    <th:block th:each="r : ${requests}">
        <div class="modal fade" th:id="'commentModal-' + ${r.id}" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content p-3">
                    <form th:action="@{/staff/comment}" method="post">
                        <input type="hidden" name="id" th:value="${r.id}">
                        <div class="mb-2">
                            <label>Staff Comment:</label>
                            <textarea name="staffComment" class="form-control" required></textarea>
                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn btn-success">Save</button>
                            <button type="button" class="btn btn-secondary" 
                                    data-bs-dismiss="modal">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </th:block>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
