<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <style>
        body { font-family: Arial; background: #f3f7f9; display: flex; justify-content: center; align-items: center; height: 100vh; }
        form { background: white; padding: 25px; border-radius: 12px; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        h2 { text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #ccc; }
        button { width: 100%; padding: 10px; background: #007bff; border: none; color: white; border-radius: 6px; cursor: pointer; }
        button:hover { background: #0069d9; }
        .error { color: red; text-align: center; }
        .success { color: green; text-align: center; }
    </style>
</head>
<body>
<form th:action="@{/login}" method="post">
    <h2>Login</h2>

    <div th:if="${error}" class="error" th:text="${error}"></div>
    <div th:if="${success}" class="success" th:text="${success}"></div>

    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Password" required>
	
	<div th:if="${param.error}" class="error">Invalid email or password</div>


    <button type="submit">Login</button>
    <p style="text-align:center;">Don't have an account? <a th:href="@{/register}">Register</a></p>
</form>
</body>
</html>
